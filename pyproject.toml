[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "common-knowledge-preflight"
version = "0.1.0"
description = "A local-first research project handoff inspection prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ck-preflight = "ck_preflight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
