name: Record tool tests

on:
  pull_request:
    paths:
      - "src/ck_records/**"
      - "tests/test_ck_records.py"
      - "examples/records/**"
      - "pyproject.toml"
      - ".github/workflows/record-tool-tests.yml"
  push:
    branches:
      - main
      - "product/**"
      - "prototype/**"
    paths:
      - "src/ck_records/**"
      - "tests/test_ck_records.py"
      - "examples/records/**"
      - "pyproject.toml"
      - ".github/workflows/record-tool-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Exercise the example CLI
        run: |
          ck-record validate examples/records/r1/record.json
          ck-record inspect examples/records/r1/record.json
